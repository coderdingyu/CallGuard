[project]
name = "callguard-ml"
version = "0.1.0"
description = "Machine learning utilities for CallGuard."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "librosa>=0.10",
  "soundfile>=0.12",
  "torch>=2.5",
  "torchaudio>=2.5",
  "transformers>=4.47",
  "datasets>=3.2",
  "huggingface-hub>=0.27",
  "joblib>=1.5",
  "pyarrow>=18.0",
  "tqdm>=4.67",
  "pyyaml>=6.0"
]

[tool.ruff]
line-length = 100
